name: Build Windows DLL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows-dll.yml"

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 (${{ matrix.compiler }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - msvc
          - clang-cl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: >-
            make
            perl
            diffutils
            nasm

      - name: Expose NASM to Windows tools
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          nasm_dir="$(cygpath -w "$(dirname "$(command -v nasm)")")"
          printf '%s\n' "$nasm_dir" >> "$GITHUB_PATH"
          nasm -v
          printf 'NASM directory: %s\n' "$nasm_dir"

      - name: Configure and generate Visual Studio project
        shell: msys2 {0}
        run: |
          set -euxo pipefail
          mkdir -p build-gha-${{ matrix.compiler }}
          cd build-gha-${{ matrix.compiler }}
          ../configure \
            --target=x86_64-win64-vs17 \
            --disable-examples \
            --disable-tools \
            --disable-docs \
            --disable-unit-tests \
            --disable-install-docs \
            --as=nasm
          make vpx.vcxproj
          test -f vpx.def
          test -f vpx.vcxproj

      - name: Convert generated project to DLL
        shell: pwsh
        run: |
          $project = "build-gha-${{ matrix.compiler }}/vpx.vcxproj"
          [xml]$xml = Get-Content $project -Raw
          $nsUri = $xml.Project.NamespaceURI
          $ns = New-Object System.Xml.XmlNamespaceManager($xml.NameTable)
          $ns.AddNamespace('m', $nsUri)

          $configurationTypes = $xml.SelectNodes("//m:PropertyGroup[@Label='Configuration']/m:ConfigurationType", $ns)
          if ($configurationTypes.Count -eq 0) {
            throw 'No ConfigurationType nodes found in generated project.'
          }
          foreach ($node in $configurationTypes) {
            $node.InnerText = 'DynamicLibrary'
          }

          $targetNames = $xml.SelectNodes('//m:PropertyGroup/m:TargetName', $ns)
          foreach ($node in $targetNames) {
            $node.InnerText = 'vpx'
          }

          if ("${{ matrix.compiler }}" -eq 'clang-cl') {
            $toolsets = $xml.SelectNodes("//m:PropertyGroup[@Label='Configuration']/m:PlatformToolset", $ns)
            if ($toolsets.Count -eq 0) {
              throw 'No PlatformToolset nodes found in generated project.'
            }
            foreach ($node in $toolsets) {
              $node.InnerText = 'ClangCl'
            }

            # libvpx's VS generator only emits /arch:AVX for avx*.c files.
            # MSVC accepts SSSE3/SSE4 intrinsics without per-file switches,
            # while clang-cl requires the corresponding target features.
            foreach ($compile in $xml.SelectNodes('//m:ClCompile[@Include]', $ns)) {
              $include = $compile.GetAttribute('Include').ToLowerInvariant()
              $extra = $null

              if ($include -match 'avx512.*\.c$') {
                $extra = '/clang:-mavx512f /clang:-mavx512bw /clang:-mavx512dq /clang:-mavx512vl /clang:-mavx512cd'
              } elseif ($include -match 'avx2.*\.c$') {
                $extra = '/clang:-mavx2'
              } elseif ($include -match 'avx.*\.c$') {
                $extra = '/clang:-mavx'
              } elseif ($include -match 'sse4.*\.c$') {
                $extra = '/clang:-msse4.1'
              } elseif ($include -match 'ssse3.*\.c$') {
                $extra = '/clang:-mssse3'
              } elseif ($include -match 'sse3.*\.c$') {
                $extra = '/clang:-msse3'
              }

              if ($null -ne $extra) {
                $options = $compile.SelectSingleNode('m:AdditionalOptions', $ns)
                if ($null -eq $options) {
                  $options = $xml.CreateElement('AdditionalOptions', $nsUri)
                  [void]$compile.AppendChild($options)
                }
                $existing = $options.InnerText.Trim()
                $options.InnerText = if ($existing) { "$existing $extra" } else { $extra }
              }
            }
          }

          $itemDefinitionGroups = $xml.SelectNodes('//m:ItemDefinitionGroup', $ns)
          if ($itemDefinitionGroups.Count -eq 0) {
            throw 'No ItemDefinitionGroup nodes found in generated project.'
          }
          foreach ($group in $itemDefinitionGroups) {
            $link = $group.SelectSingleNode('m:Link', $ns)
            if ($null -eq $link) {
              $link = $xml.CreateElement('Link', $nsUri)
              [void]$group.AppendChild($link)
            }

            $debugInfo = $link.SelectSingleNode('m:GenerateDebugInformation', $ns)
            if ($null -eq $debugInfo) {
              $debugInfo = $xml.CreateElement('GenerateDebugInformation', $nsUri)
              [void]$link.AppendChild($debugInfo)
            }
            $debugInfo.InnerText = 'true'

            $defFile = $link.SelectSingleNode('m:ModuleDefinitionFile', $ns)
            if ($null -eq $defFile) {
              $defFile = $xml.CreateElement('ModuleDefinitionFile', $nsUri)
              [void]$link.AppendChild($defFile)
            }
            $defFile.InnerText = 'vpx.def'
          }

          $settings = New-Object System.Xml.XmlWriterSettings
          $settings.Indent = $true
          $settings.Encoding = New-Object System.Text.UTF8Encoding($false)
          $writer = [System.Xml.XmlWriter]::Create((Resolve-Path $project), $settings)
          try {
            $xml.Save($writer)
          } finally {
            $writer.Dispose()
          }

          Write-Host '--- Project type/toolset ---'
          Select-String -Path $project -Pattern '<ConfigurationType>|<PlatformToolset>|<TargetName>|<ModuleDefinitionFile>'
          if ("${{ matrix.compiler }}" -eq 'clang-cl') {
            Write-Host '--- clang-cl SIMD per-file options ---'
            Select-String -Path $project -Pattern 'mavx|msse|mssse'
          }

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Expose Visual C++ tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            $vswhere = 'C:\ProgramData\Chocolatey\bin\vswhere.exe'
          }
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $install) {
            throw 'Visual Studio C++ toolchain was not found.'
          }

          $msvcRoot = Join-Path $install 'VC\Tools\MSVC'
          $msvcVersion = Get-ChildItem $msvcRoot -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if ($null -eq $msvcVersion) {
            throw 'MSVC tools directory was not found.'
          }
          $msvcBin = Join-Path $msvcVersion.FullName 'bin\Hostx64\x64'
          if (-not (Test-Path (Join-Path $msvcBin 'dumpbin.exe'))) {
            throw "dumpbin.exe was not found in $msvcBin"
          }
          $msvcBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          $llvmBin = Join-Path $install 'VC\Tools\Llvm\x64\bin'
          if (Test-Path (Join-Path $llvmBin 'clang-cl.exe')) {
            $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          Write-Host "MSVC tools: $msvcBin"
          Write-Host "LLVM tools: $llvmBin"

      - name: Build Release DLL
        shell: pwsh
        run: |
          nasm -v
          if ("${{ matrix.compiler }}" -eq 'clang-cl') {
            clang-cl --version
          } else {
            cl 2>&1 | Select-Object -First 3
          }
          msbuild "build-gha-${{ matrix.compiler }}/vpx.vcxproj" `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:UseMultiToolTask=true `
            /verbosity:minimal

      - name: Collect package
        shell: pwsh
        run: |
          $build = "build-gha-${{ matrix.compiler }}"
          $release = Join-Path $build 'x64/Release'
          $out = "artifact-${{ matrix.compiler }}"
          New-Item -ItemType Directory -Force -Path "$out/bin", "$out/lib", "$out/include/vpx" | Out-Null

          $dll = Join-Path $release 'vpx.dll'
          if (-not (Test-Path $dll)) {
            Write-Host 'Files produced under the build directory:'
            Get-ChildItem $build -Recurse -File | Select-Object FullName
            throw "vpx.dll was not produced at $dll"
          }

          Copy-Item $dll "$out/bin/vpx.dll"
          if (Test-Path (Join-Path $release 'vpx.lib')) {
            Copy-Item (Join-Path $release 'vpx.lib') "$out/lib/vpx.lib"
          }
          if (Test-Path (Join-Path $release 'vpx.exp')) {
            Copy-Item (Join-Path $release 'vpx.exp') "$out/lib/vpx.exp"
          }

          Copy-Item vpx/*.h "$out/include/vpx/"
          Copy-Item LICENSE "$out/LICENSE"
          Copy-Item PATENTS "$out/PATENTS"

      - name: Verify exports and dependencies
        shell: pwsh
        run: |
          $out = "artifact-${{ matrix.compiler }}"
          $dll = "$out/bin/vpx.dll"
          $exports = (& dumpbin /nologo /exports $dll | Out-String)
          $deps = (& dumpbin /nologo /dependents $dll | Out-String)

          Write-Host '--- Required exports ---'
          foreach ($symbol in @(
            'vpx_codec_vp9_cx',
            'vpx_codec_enc_config_default',
            'vpx_codec_enc_init_ver',
            'vpx_codec_encode',
            'vpx_codec_get_cx_data',
            'vpx_codec_destroy'
          )) {
            if ($exports -notmatch "(?m)\b$([regex]::Escape($symbol))\b") {
              throw "Missing required export: $symbol"
            }
            Write-Host "OK: $symbol"
          }

          Write-Host '--- DLL dependencies ---'
          Write-Host $deps

          $exports | Set-Content "$out/exports.txt"
          $deps | Set-Content "$out/dependencies.txt"

      - name: Record compiler identity
        shell: pwsh
        run: |
          $out = "artifact-${{ matrix.compiler }}/compiler.txt"
          if ("${{ matrix.compiler }}" -eq 'clang-cl') {
            (& clang-cl --version | Out-String) | Set-Content $out
          } else {
            (cl 2>&1 | Out-String) | Set-Content $out
          }
          Get-Content $out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvpx-win-x64-${{ matrix.compiler }}
          path: artifact-${{ matrix.compiler }}/
          if-no-files-found: error
